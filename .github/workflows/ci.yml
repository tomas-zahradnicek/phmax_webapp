name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:seo-routing
      - run: npm run check:ci-guards-manifest
      - run: npm run check:release-manifest
      - run: npm run check:no-legacy-root-pages
      - run: npm run check:readme-sync
      - run: npm run check:ci-summary-manifest
      - run: npm run check:golden-manifest
      - run: npm run test:golden
      - run: npm test
      - run: npm run lint
      - run: npm run test:e2e:install
      - run: npm run test:e2e
